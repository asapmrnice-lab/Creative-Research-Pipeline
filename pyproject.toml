[project]
name = "research-pipeline"
version = "0.1.0"
description = "Personal creative research pipeline -- mechanical collect, store, structure, retrieve."
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# src/ layout: put the package on sys.path without needing an install step.
pythonpath = ["src"]
testpaths = ["tests"]
